name: Desglose tiempos NBA
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pruebas-integracion-nba-4-motores
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python instalar_desglose_nba.py
          python -m py_compile nba_tarjeta_puente.py nba_tarjeta_auto.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nba_tarjeta_puente.py nba_tarjeta_auto.py
          if ! git diff --cached --quiet; then
            git commit -m 'Medir tiempos internos de tarjeta NBA'
            git push origin HEAD:pruebas-integracion-nba-4-motores
          fi
