name: NBA - Probar tres motores persistentes
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        ref: pruebas-integracion-nba-4-motores
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Instalar dependencias de modelos
      run: python -m pip install pandas numpy scikit-learn streamlit requests
    - name: Probar Base, Modelo C y Ensemble sin guardar
      env:
        SCRIPT_B64: 
      run: 'python - <<''PY''

        import os,base64

        exec(compile(base64.b64decode(os.environ[''SCRIPT_B64'']),''prueba'',''exec''))

        PY'
    - name: Publicar resultado
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nba-prueba-tres-motores
        path: nba_prueba_tres_motores.json
        if-no-files-found: ignore
