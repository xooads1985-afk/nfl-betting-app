name: NBA Laboratorio - Tarjetas por Lotes
on:
  workflow_dispatch:
    inputs:
      max_partidos:
        description: 'Número de próximos partidos (1 a 30)'
        required: true
        default: '10'
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
jobs:
  tarjetas:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Dependencias
        run: pip install pandas numpy scikit-learn requests
      - name: Generar y validar tarjetas
        env:
          MAX_PARTIDOS: ${{ github.event.inputs.max_partidos || '10' }}
        run: python nba_lab_lotes.py --max-partidos "$MAX_PARTIDOS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-tarjetas-lotes
          path: nba_lab_resultados_futuro/lotes/
          retention-days: 7
