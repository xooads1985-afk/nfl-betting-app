name: NBA - Guardado consolidado manual
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  instalar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pruebas-integracion-nba-4-motores
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar modulo de guardado
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          Path("nba_guardado_consolidado.py").write_bytes(base64.b64decode(""))
          PY
      - name: Integrar boton de guardado manual
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("nba_tarjeta_auto.py")
          s = p.read_text(encoding="utf-8")
          marca = "NBA_GUARDADO_CONSOLIDADO_MANUAL_V1"
          if marca not in s:
              ancla = '        st.caption("No escribe ni modifica registros en Supabase.")'
              if s.count(ancla) != 1:
                  raise RuntimeError("Ancla de preguardado no encontrada; no se cambia archivo")
              bloque = """
                  # NBA_GUARDADO_CONSOLIDADO_MANUAL_V1
                  if 'preparado' in locals() and preparado.get("estado") == "validado_sin_guardar":
                      if st.button("💾 Guardar proyección consolidada", key="nba_guardar_consolidado_" + str(compartido["partido_id"])):
                          from nba_guardado_consolidado import guardar_preparado
                          url_guardado = str(st.secrets.get("SUPABASE_URL", ""))
                          clave_guardado = str(st.secrets.get("SUPABASE_SECRET_KEY", ""))
                          try:
                              resultado_guardado = guardar_preparado(
                                  preparado, url=url_guardado, clave=clave_guardado
                              )
                              estado_guardado = resultado_guardado["estado"]
                              if estado_guardado == "guardado_verificado":
                                  st.success("Proyección guardada y verificada en Supabase.")
                              elif estado_guardado == "ya_existe":
                                  st.info("Este partido ya tiene una proyección; no se sobrescribió.")
                              elif estado_guardado == "partido_iniciado":
                                  st.warning("El partido ya comenzó: guardado bloqueado.")
                              else:
                                  st.warning("Guardado sin confirmar: " + estado_guardado)
                          except (ValueError, KeyError, TypeError) as exc:
                              st.error("Guardado bloqueado: " + str(exc))
          """
              s=s.replace(ancla,ancla+"\n"+bloque.rstrip(),1)
              compile(s,str(p),"exec")
              p.write_text(s,encoding="utf-8")
              print("Botón manual instalado")
          else:
              print("Botón ya instalado")
          PY
      - name: Verificar sintaxis
        run: python -m py_compile nba_guardado_consolidado.py nba_tarjeta_auto.py
      - name: Guardar en rama experimental
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- nba_guardado_consolidado.py nba_tarjeta_auto.py
          if ! git diff --cached --quiet; then
            git commit -m "NBA: guardado manual consolidado sin sobrescritura"
            git push origin HEAD:pruebas-integracion-nba-4-motores
          fi
