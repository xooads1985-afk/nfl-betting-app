name: NBA - Validar optimizacion historica
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pruebas-integracion-nba-4-motores
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Validar sin secretos Supabase
        run: |
          python - <<'PY'
          import time, requests
          import numpy as np
          import pandas as pd
          from datetime import date, timedelta
          from nba_lab_motor_offline import _nba_lab_ml_caracteristicas, _nba_lab_dias_descanso

          def indexar(datos):
              equipos = pd.unique(pd.concat([datos['local'], datos['visitante']], ignore_index=True))
              grupos = {}
              for equipo in equipos:
                  t = datos.loc[datos['local'].eq(equipo) | datos['visitante'].eq(equipo)].copy()
                  sede = t['local'].eq(equipo)
                  t['PF'] = t['puntos_local'].where(sede, t['puntos_visitante'])
                  t['PC'] = t['puntos_visitante'].where(sede, t['puntos_local'])
                  t['Rival'] = t['visitante'].where(sede, t['local'])
                  t['Sede'] = sede.map({True: 'Local', False: 'Visitante'})
                  t['Resultado'] = ['V' if a > b else 'D' if a < b else 'E' for a,b in zip(t['PF'], t['PC'])]
                  t = t.sort_values('fecha_utc')
                  grupos[equipo] = (t, pd.to_datetime(t['fecha_utc'], utc=True, errors='coerce'))
              fechas = datos['_fecha_ml']
              def calcular(juego):
                  fecha = pd.to_datetime(juego['fecha_utc'], utc=True, errors='coerce')
                  if pd.isna(fecha): return []
                  anteriores = datos.loc[fechas.lt(fecha)]
                  if len(anteriores) < 10: return []
                  liga = float(pd.concat([anteriores['puntos_local'], anteriores['puntos_visitante']]).mean())
                  filas = []
                  for equipo, rival, local in ((juego['local'], juego['visitante'], 1), (juego['visitante'], juego['local'], 0)):
                      if equipo not in grupos or rival not in grupos: return []
                      propio = grupos[equipo][0].loc[grupos[equipo][1].lt(fecha)]
                      contrario = grupos[rival][0].loc[grupos[rival][1].lt(fecha)]
                      if min(len(propio), len(contrario)) < 3: return []
                      pf = pd.to_numeric(propio['PF'], errors='coerce').dropna().tail(10)
                      pc = pd.to_numeric(propio['PC'], errors='coerce').dropna().tail(10)
                      rp = pd.to_numeric(contrario['PF'], errors='coerce').dropna().tail(10)
                      rc = pd.to_numeric(contrario['PC'], errors='coerce').dropna().tail(10)
                      if min(len(pf),len(pc),len(rp),len(rc)) < 3: return []
                      base = (float(pf.mean()) + float(rc.mean())) / 2
                      descanso = _nba_lab_dias_descanso(propio, fecha)
                      descanso_rival = _nba_lab_dias_descanso(contrario, fecha)
                      vector = [base,float(pf.mean()),float(rc.mean()),float(pc.mean()),float(rp.mean()),float(pf.tail(5).mean()),float(rc.tail(5).mean()),float(local),float(max(-3,min(3,(descanso or 0)-(descanso_rival or 0)))),float(min(len(propio),20)),liga]
                      filas.append({'equipo':str(equipo),'x':np.asarray(vector,dtype=float),'base':base,'n':len(propio),'liga':liga,'real':float(juego['puntos_local'] if local else juego['puntos_visitante'])})
                  return filas
              return calcular

          registros=[]
          for delta in range(30):
              dia=date.today()-timedelta(days=30-delta)
              respuesta=requests.get('https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard',params={'dates':dia.strftime('%Y%m%d'),'limit':100},timeout=20)
              respuesta.raise_for_status()
              for evento in respuesta.json().get('events',[]):
                  comp=(evento.get('competitions') or [{}])[0]
                  equipos=comp.get('competitors',[])
                  casa=next((x for x in equipos if x.get('homeAway')=='home'),{})
                  visita=next((x for x in equipos if x.get('homeAway')=='away'),{})
                  if not evento.get('status',{}).get('type',{}).get('completed',False): continue
                  registros.append({'id':str(evento.get('id','')),'fecha_utc':evento.get('date',''),'local':casa.get('team',{}).get('displayName',''),'visitante':visita.get('team',{}).get('displayName',''),'puntos_local':pd.to_numeric(casa.get('score'),errors='coerce'),'puntos_visitante':pd.to_numeric(visita.get('score'),errors='coerce'),'finalizado':True})
          h=pd.DataFrame(registros)
          if h.empty: raise RuntimeError('ESPN no devolvió partidos finalizados')
          h=h.drop_duplicates('id').dropna(subset=['puntos_local','puntos_visitante']).copy()
          h['_fecha_ml']=pd.to_datetime(h['fecha_utc'],utc=True,errors='coerce')
          h=h.dropna(subset=['_fecha_ml']).sort_values('_fecha_ml')
          if len(h)<30: raise RuntimeError('Muestra insuficiente: '+str(len(h)))
          juegos=h.to_dict('records')
          t=time.perf_counter()
          original=[_nba_lab_ml_caracteristicas(h,j) for j in juegos]
          t_original=time.perf_counter()-t
          t=time.perf_counter()
          rapido=indexar(h)
          optimizado=[rapido(j) for j in juegos]
          t_optimizado=time.perf_counter()-t
          for i,(a,b) in enumerate(zip(original,optimizado)):
              if len(a)!=len(b): raise AssertionError(f'Juego {i}: distinto número de vectores')
              for x,y in zip(a,b):
                  for k in ('equipo','n','real'):
                      if x[k]!=y[k]: raise AssertionError(f'Juego {i}: {k} diferente')
                  for k in ('x','base','liga'):
                      if not np.allclose(x[k],y[k],rtol=0,atol=1e-10): raise AssertionError(f'Juego {i}: {k} diferente')
          print('EQUIVALENCIA CONFIRMADA:',len(juegos),'partidos')
          print('Original:',round(t_original,2),'s; indexado:',round(t_optimizado,2),'s')
          PY
