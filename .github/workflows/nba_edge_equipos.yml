name: NBA - Integrar Edge por equipos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener rama experimental
        uses: actions/checkout@v4
        with:
          ref: pruebas-integracion-nba-4-motores
          fetch-depth: 0
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Integrar referencias y Edge individual
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          resumen = Path('resumen_inteligente_nba.py')
          tarjeta = Path('nba_tarjeta_auto.py')
          a = resumen.read_text(encoding='utf-8')
          b = tarjeta.read_text(encoding='utf-8')
          marca = 'NBA_EDGE_EQUIPOS_V2'
          if marca in a and marca in b:
              print('Integración ya instalada')
              raise SystemExit(0)
          if marca in a or marca in b:
              raise RuntimeError('Integración parcial: no se modificó nada')

          def sustituir(texto, viejo, nuevo, etiqueta):
              cantidad = texto.count(viejo)
              if cantidad != 1:
                  raise RuntimeError(f'{etiqueta}: {cantidad} coincidencias; se esperaba 1')
              return texto.replace(viejo, nuevo, 1)

          salto = chr(10)
          viejo = "                      'Referencia total': round(a['referencia'] + b['referencia'], 1) if a and b else None,"
          nuevo = salto.join([
              "                      # NBA_EDGE_EQUIPOS_V2",
              "                      'Referencia visitante': round(a['referencia'], 3) if a else None,",
              "                      'Referencia local': round(b['referencia'], 3) if b else None,",
              viejo,
          ])
          a = sustituir(a, viejo, nuevo, 'Referencias del resumen')

          viejo = '    referencia_total = None' + salto + salto + '    if tabla is not None and hasattr(tabla, "columns"):'
          nuevo = salto.join([
              '    # NBA_EDGE_EQUIPOS_V2',
              '    referencia_total = None',
              '    referencia_local = None',
              '    referencia_visitante = None',
              '',
              '    if tabla is not None and hasattr(tabla, "columns"):',
          ])
          b = sustituir(b, viejo, nuevo, 'Inicialización de tarjeta')

          viejo = salto.join([
              '            if not filas.empty:',
              '                referencia_total = _numero(',
              '                    filas.iloc[0]["Referencia total"]',
              '                )',
          ])
          nuevo = salto.join([
              '            if not filas.empty:',
              '                fila = filas.iloc[0]',
              '                referencia_total = _numero(fila["Referencia total"])',
              '                referencia_local = _numero(fila.get("Referencia local"))',
              '                referencia_visitante = _numero(fila.get("Referencia visitante"))',
          ])
          b = sustituir(b, viejo, nuevo, 'Lectura de referencias')

          viejo = '        "referencia_total": referencia_total,'
          nuevo = salto.join([
              viejo,
              '        "referencia_local": referencia_local,',
              '        "referencia_visitante": referencia_visitante,',
              '        "edge_local": (',
              '            _numero(principal.get("local")) - referencia_local',
              '            if _numero(principal.get("local")) is not None and referencia_local is not None',
              '            else None',
              '        ),',
              '        "edge_visitante": (',
              '            _numero(principal.get("visitante")) - referencia_visitante',
              '            if _numero(principal.get("visitante")) is not None and referencia_visitante is not None',
              '            else None',
              '        ),',
          ])
          b = sustituir(b, viejo, nuevo, 'Resultado compartido')

          inicio = b.index('def _mostrar_edge(st, compartido):')
          fin = b.index(salto + 'def _mostrar_previa(', inicio)
          funcion = [
              'def _mostrar_edge(st, compartido):',
              '    """Edge por equipo y total, sin nuevas consultas."""',
              '    import pandas as pd',
              '    st.markdown("**📐 Proyección, referencia y Edge**")',
              '    filas = []',
              '    for nombre, proy, ref, edge, motor in (',
              '        (compartido["visitante"], compartido.get("puntos_visitante"), compartido.get("referencia_visitante"), compartido.get("edge_visitante"), compartido.get("motor_equipos")),',
              '        (compartido["local"], compartido.get("puntos_local"), compartido.get("referencia_local"), compartido.get("edge_local"), compartido.get("motor_equipos")),',
              '        ("Total del partido", compartido.get("total"), compartido.get("referencia_total"), compartido.get("edge_total"), compartido.get("motor_total")),',
              '    ):',
              '        filas.append({',
              '            "Estadística": nombre,',
              '            "Motor": motor or "Sin validar",',
              '            "Proyección": round(proy, 1) if proy is not None else None,',
              '            "Referencia": round(ref, 1) if ref is not None else None,',
              '            "Edge": round(edge, 1) if edge is not None else None,',
              '        })',
              '    st.dataframe(pd.DataFrame(filas), hide_index=True, use_container_width=True)',
              '    st.caption("Edge = proyección seleccionada − referencia histórica. No representa probabilidad.")',
              '',
          ]
          b = b[:inicio] + salto.join(funcion) + b[fin:]

          viejo = '        diferencia = puntos_local - puntos_visita'
          nuevo = salto.join([
              viejo,
              '        # NBA_EDGE_EQUIPOS_V2',
              '        for nombre, referencia, edge in (',
              '            (visita, consolidado.get("referencia_visitante"), consolidado.get("edge_visitante")),',
              '            (local, consolidado.get("referencia_local"), consolidado.get("edge_local")),',
              '        ):',
              '            if referencia is not None and edge is not None:',
              '                st.caption(f"{nombre} · referencia: {float(referencia):.1f} pts · Edge: {float(edge):+.1f} pts")',
              '            else:',
              '                st.caption(f"{nombre} · Edge individual no disponible")',
          ])
          a = sustituir(a, viejo, nuevo, 'Interpretación del resumen')

          compile(a, str(resumen), 'exec')
          compile(b, str(tarjeta), 'exec')
          resumen.write_text(a, encoding='utf-8')
          tarjeta.write_text(b, encoding='utf-8')
          print('Integración validada en los dos archivos')
          PY

      - name: Verificar sintaxis Python
        run: python -m py_compile resumen_inteligente_nba.py nba_tarjeta_auto.py

      - name: Guardar únicamente en la rama experimental
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- resumen_inteligente_nba.py nba_tarjeta_auto.py
          if git diff --cached --quiet; then
            echo 'Sin cambios pendientes'
          else
            git commit -m 'NBA: Edge individual con referencias históricas'
            git push origin HEAD:pruebas-integracion-nba-4-motores
          fi
