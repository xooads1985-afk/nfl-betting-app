name: Optimizar tarjeta NBA (pruebas)
on:
  push:
    branches: [pruebas-integracion-nba-4-motores]
    paths:
      - optimizar_tarjeta_nba.py
      - .github/workflows/optimizar_tarjeta_nba.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimizar:
    if: github.ref_name == 'pruebas-integracion-nba-4-motores'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pruebas-integracion-nba-4-motores
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar y comprobar sintaxis
        run: |
          python optimizar_tarjeta_nba.py
          python -m py_compile nba_tarjeta_auto.py nba_tarjeta_puente.py nba_prediccion_tarjeta.py
      - name: Confirmar cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nba_tarjeta_auto.py nba_tarjeta_puente.py nba_prediccion_tarjeta.py
          if ! git diff --cached --quiet; then
            git commit -m 'Optimizar tarjeta NBA y vista movil Edge'
            git push origin HEAD:pruebas-integracion-nba-4-motores
          fi
