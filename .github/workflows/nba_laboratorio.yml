name: NBA Laboratorio - Calculo externo

on:
  workflow_dispatch:
    inputs:
      max_fechas:
        description: 'Dias historicos pendientes a validar (0 = todos; recomendado 10-20)'
        required: true
        default: '10'
  schedule:
    - cron: '17 8 * * *'

permissions:
  contents: write

concurrency:
  group: nba-lab-offline
  cancel-in-progress: false

jobs:
  laboratorio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: python -m pip install pandas numpy requests scikit-learn
      - name: Calcular modelos fuera de Streamlit
        env:
          MAX_FECHAS: ${{ github.event_name == 'schedule' && '20' || inputs.max_fechas || '10' }}
        run: python nba_lab_ejecutar.py --max-fechas "$MAX_FECHAS"
      - name: Auditar predicciones historicas
        run: python nba_lab_auditoria.py --entrada nba_lab_resultados/algoritmos_predicciones.csv --salida nba_lab_auditoria_resultados
      - name: Verificar localia, integridad y temporalidad
        run: python nba_lab_control_avanzado.py --temporal
      - name: Ampliar prueba temporal a multiples fechas
        run: python nba_lab_prueba_temporal_ampliada.py --fechas 20
      - name: Validar todos los modelos
        run: python nba_lab_validacion_modelos.py
      - name: Guardar resultados en repositorio
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba_lab_resultados nba_lab_cache nba_lab_auditoria_resultados
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar resultados y auditoria NBA [skip ci]"
            git push
          else
            echo "No hay cambios nuevos que guardar."
          fi
      - name: Respaldo descargable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-laboratorio-resultados
          path: |
            nba_lab_resultados/
            nba_lab_auditoria_resultados/
          if-no-files-found: warn
