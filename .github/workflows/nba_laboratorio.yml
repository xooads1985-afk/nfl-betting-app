name: NBA Laboratorio - Calculo externo
on:
  workflow_dispatch:
    inputs:
      max_fechas:
        description: 'Fechas nuevas a validar (0 = todas)'
        required: true
        default: '10'
  schedule:
    # Activar la programación diaria después de verificar el backfill.
    # - cron: '25 13 * * *'
permissions:
  contents: write
concurrency:
  group: nba-lab-offline
  cancel-in-progress: false
jobs:
  laboratorio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar dependencias
        run: pip install pandas numpy requests scikit-learn
      - name: Calcular modelos fuera de Streamlit
        run: python nba_lab_ejecutar.py --max-fechas "${{ github.event.inputs.max_fechas || '0' }}"
      - name: Guardar resultados en repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba_lab_resultados nba_lab_cache
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar resultados del laboratorio NBA [skip ci]"
            git push
          fi
      - name: Respaldo descargable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-laboratorio-resultados
          path: nba_lab_resultados/
          if-no-files-found: ignore
