name: NBA - Preparar historial persistente
on:
  workflow_dispatch:
  schedule:
    - cron: "25 12 * * *"
permissions:
  contents: write
concurrency:
  group: nba-historial-preparado
  cancel-in-progress: false
jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pruebas-integracion-nba-4-motores
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: python -m pip install pandas requests
      - name: Generar instantanea validada
        env:
          SCRIPT_B64: ""
        run: |
          python - <<'PY'
          import os, base64
          exec(compile(base64.b64decode(os.environ["SCRIPT_B64"]), "nba_preparacion", "exec"))
          PY
      - name: Publicar solo instantanea experimental
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- nba_cache_preparada/historial_finalizados.csv nba_cache_preparada/manifiesto.json
          if ! git diff --cached --quiet; then
            git commit -m "NBA: actualizar instantanea historica validada"
            git push origin HEAD:pruebas-integracion-nba-4-motores
          fi
