name: NBA - Integrar lectura persistente segura
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pruebas-integracion-nba-4-motores
      - name: Instalar lector
        env:
          SCRIPT_B64: ""
        run: |
          python - <<'PY'
          import os,base64,ast,pathlib
          s=base64.b64decode(os.environ["SCRIPT_B64"]).decode()
          ast.parse(s)
          pathlib.Path("nba_vectores_persistentes.py").write_text(s)
          PY
      - name: Integrar con respaldo
        env:
          PATCH_B64: ""
        run: |
          python - <<'PY'
          import os,base64
          exec(compile(base64.b64decode(os.environ["PATCH_B64"]),"patch","exec"))
          PY
      - name: Verificar sintaxis
        run: python -m py_compile nba_vectores_persistentes.py nba_laboratorio_prospectivo.py
      - name: Publicar solo en rama experimental
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba_vectores_persistentes.py nba_laboratorio_prospectivo.py
          if ! git diff --cached --quiet; then
            git commit -m "NBA: lector de vectores persistentes"
            git push origin HEAD:pruebas-integracion-nba-4-motores
          fi
