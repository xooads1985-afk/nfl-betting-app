name: NBA Lab - actualizar Pace y periodos
on:
  workflow_dispatch:
  schedule:
    - cron: '25 13 * * *'
permissions:
  contents: write
concurrency:
  group: nba-pace-periodos-experimental
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pruebas-integracion-nba-4-motores
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Actualizar y comprobar cobertura
        run: python actualizar_pace_periodos_nba.py
      - name: Publicar reporte
        uses: actions/upload-artifact@v4
        with:
          name: nba-pace-periodos-actualizacion
          path: nba_pace_actualizacion_reporte.json
          if-no-files-found: error
      - name: Guardar solo CSV experimentales
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba_historial_pace.csv nba_historial_pace_periodos_validado.csv
          if git diff --cached --quiet; then
            echo "Sin partidos nuevos"
          else
            git commit -m "Actualizar historial NBA Pace y periodos verificados"
            git push origin HEAD:pruebas-integracion-nba-4-motores
          fi
