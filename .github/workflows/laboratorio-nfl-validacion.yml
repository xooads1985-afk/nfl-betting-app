
name: Laboratorio NFL - Validacion historica

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-nfl:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar archivos del laboratorio
        run: |
          python -m compileall -q \
            nfl_lab_precision.py \
            ejecutar_pipeline.py \
            descargar_nflverse.py \
            comparacion_motor_real.py

      - name: Ejecutar validacion historica
        run: |
          python ejecutar_pipeline.py \
            --seasons 2022 2023 2024 2025 \
            --first-season 2024 \
            --output resultados_nfl

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-laboratorio-nfl
          path: resultados_nfl/
          if-no-files-found: warn
          retention-days: 14
