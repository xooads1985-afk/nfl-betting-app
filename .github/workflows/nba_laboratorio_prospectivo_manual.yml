name: NBA laboratorio prospectivo - prueba manual
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry_run no guarda; save registra nuevas predicciones'
        required: true
        type: choice
        default: dry_run
        options:
          - dry_run
          - save
permissions:
  contents: read
concurrency:
  group: nba-laboratorio-prospectivo
  cancel-in-progress: false
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Ejecutar laboratorio
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python nba_lab_registro_automatico.py --mode '${{ inputs.mode }}'
