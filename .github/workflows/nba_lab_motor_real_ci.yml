name: NBA Laboratorio - Motor Real Calendario
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  motor-real:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar rama experimental
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: python -m pip install pandas numpy scikit-learn requests
      - name: Validar archivos experimentales
        run: |
          python -m py_compile nba_lab_motor_futuro.py nba_lab_puente_futuro.py nba_lab_puente_seguro.py nba_lab_prueba_real.py
          python -m unittest test_guardia.py -v
      - name: Actualizar historial y clasificacion
        run: |
          python nba_lab_descargar_cache.py --desde 2025-10-21 --hasta "$(date -u +%Y-%m-%d)"
      - name: Generar predicciones reales del calendario
        run: python nba_lab_prueba_real.py
      - name: Subir auditoria y tarjetas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-motor-real-calendario
          path: nba_lab_resultados_futuro/prueba_real/
          if-no-files-found: warn
