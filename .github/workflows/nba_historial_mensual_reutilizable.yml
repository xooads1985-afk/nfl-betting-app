name: NBA - Historial mensual reutilizable
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pruebas-integracion-nba-4-motores
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          mod=base64.b64decode('').decode()
          Path('nba_historial_bloques.py').write_text(mod,encoding='utf-8')
          p=Path('nba_tarjeta_auto.py')
          s=p.read_text(encoding='utf-8')
          old='''            dependencias = adaptadores_reales(
                          cargador_historial=cargador_historial
                      )
          '''
          new='''            # NBA_HISTORIAL_MENSUAL_CACHE_V1
                      from nba_historial_bloques import cargar_por_bloques
                      def _historial_mensual(desde, hasta):
                          return cargar_por_bloques(cargador_historial, desde, hasta)
                      dependencias = adaptadores_reales(
                          cargador_historial=_historial_mensual
                      )
          '''
          if 'NBA_HISTORIAL_MENSUAL_CACHE_V1' not in s:
              assert s.count(old)==1, 'Ancla no coincide; abortar'
              s=s.replace(old,new,1)
              compile(s,str(p),'exec')
              p.write_text(s,encoding='utf-8')
          compile(mod,'nba_historial_bloques.py','exec')
          PY
      - name: Verificar
        run: python -m py_compile nba_historial_bloques.py nba_tarjeta_auto.py
      - name: Guardar en rama experimental
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba_historial_bloques.py nba_tarjeta_auto.py
          if ! git diff --cached --quiet; then
            git commit -m "NBA: cache historico por meses"
            git push origin HEAD:pruebas-integracion-nba-4-motores
          fi
