name: NBA - Validar esquema persistente sin activar
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pruebas-integracion-nba-4-motores
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias
        run: python -m pip install -r requirements.txt
      - name: Comparar motores con esquema adaptado
        env:
          SCRIPT_B64: ''
        run: |
          python - <<'PYCODE'
          import base64,os
          exec(compile(base64.b64decode(os.environ['SCRIPT_B64']),'validar_esquema','exec'))
          PYCODE
      - name: Publicar informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-validacion-esquema
          path: auditoria_esquema_nba.json
          if-no-files-found: ignore
