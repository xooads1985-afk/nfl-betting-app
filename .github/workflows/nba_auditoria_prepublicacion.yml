name: NBA Lab - auditoria prepublicacion tarjeta
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pruebas-integracion-nba-4-motores
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Auditar archivos e integracion sin alterar codigo
        run: python auditar_prepublicacion_nba.py
      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-prepublicacion-auditoria
          path: nba_prepublicacion_reporte.json
          if-no-files-found: warn
