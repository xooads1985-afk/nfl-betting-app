name: NBA - Prueba funcional motores offline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pruebas-integracion-nba-4-motores
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias
        run: python -m pip install pandas numpy scikit-learn
      - name: Ejecutar prueba funcional aislada
        env:
          NBA_SCRIPT_B64: ''
        run: |
          python - <<'PYCODE'
          import os,base64
          exec(compile(base64.b64decode(os.environ['NBA_SCRIPT_B64']),'nba_prueba','exec'))
          PYCODE
      - name: Guardar informe incluso si falla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-prueba-motores-offline
          path: nba_prueba_motores_offline.json
          if-no-files-found: warn
