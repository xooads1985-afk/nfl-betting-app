name: NBA - Auditar cobertura reciente
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cobertura:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pruebas-integracion-nba-4-motores
      - name: Comparar snapshot con ESPN sin modificar archivos
        env:
          AUDIT_SCRIPT: ""
        run: |
          python - <<'PYCODE'
          import os, base64
          exec(compile(base64.b64decode(os.environ['AUDIT_SCRIPT']), 'auditoria_cobertura', 'exec'))
          PYCODE
      - name: Guardar informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-auditoria-cobertura
          path: nba_auditoria_cobertura.json
          if-no-files-found: warn

