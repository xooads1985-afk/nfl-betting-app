name: NBA - Preparar vectores persistentes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pruebas-integracion-nba-4-motores
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias
        run: python -m pip install -r requirements.txt
      - name: Validar y preparar vectores
        env:
          SCRIPT_B64: ""
        run: |
          python - <<'PY'
          import os, base64
          exec(compile(base64.b64decode(os.environ["SCRIPT_B64"]), "preparacion_vectores", "exec"))
          PY
      - name: Publicar vectores solo en rama experimental
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba_cache_preparada/entrenamiento_indexado.jsonl nba_cache_preparada/manifiesto_entrenamiento.json
          if ! git diff --cached --quiet; then
            git commit -m "NBA: preparar vectores historicos validados"
            git push origin HEAD:pruebas-integracion-nba-4-motores
          fi
