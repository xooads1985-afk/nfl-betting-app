name: Actualizar historial NBA (diario)

on:
  workflow_dispatch:
  schedule:
    # 13:00 UTC = 06:00 en Sinaloa (America/Mazatlan, UTC-7).
    - cron: "0 13 * * *"

permissions:
  contents: read

concurrency:
  group: nba-historial-supabase
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Actualizar últimos 7 días
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python actualizar_historial_nba.py --dias 7
