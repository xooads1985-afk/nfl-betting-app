name: Migracion historial NBA a Supabase

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Migrar historial NBA
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python migrar_nba_supabase.py
