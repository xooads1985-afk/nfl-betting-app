name: NBA laboratorio prospectivo - automatico

on:
  schedule:
    # GitHub Actions usa UTC. Dos revisiones para cubrir cambios de calendario.
    - cron: '0 12,20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nba-laboratorio-prospectivo
  cancel-in-progress: false

jobs:
  registrar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Registrar predicciones prospectivas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python nba_lab_registro_automatico.py --mode save
