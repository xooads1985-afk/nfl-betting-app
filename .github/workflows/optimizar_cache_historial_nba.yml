name: Optimizar cache historial NBA
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pruebas-integracion-nba-4-motores
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar cache y comprobar sintaxis
        run: |
          python instalar_cache_historial_nba.py
          python -m py_compile nba_conexion_tarjeta.py
      - name: Guardar en rama experimental
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nba_conexion_tarjeta.py
          if ! git diff --cached --quiet; then
            git commit -m 'Cache compartida de historial NBA'
            git push origin HEAD:pruebas-integracion-nba-4-motores
          fi
