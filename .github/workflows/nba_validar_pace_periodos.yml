name: NBA Lab - validar Pace Q1 y mitad
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: python -m pip install 'pandas>=2.0,<3'
      - name: Validar sin modificar la rama
        run: python validar_nba_pace_periodos.py
      - name: Publicar resultados
        uses: actions/upload-artifact@v4
        with:
          name: nba-pace-q1-mitad-validacion
          path: reportes_pace_periodos/
          if-no-files-found: error
