name: NBA - Instalar indexacion rapida validada
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  instalar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pruebas-integracion-nba-4-motores
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Validar equivalencia e instalar indexacion
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import base64
          Path('nba_features_indexadas.py').write_bytes(base64.b64decode(''))
          codigo=base64.b64decode('').decode('utf-8')
          exec(compile(codigo, 'instalador_indexacion.py', 'exec'))
          PYCODE
      - name: Comprobar sintaxis
        run: python -m py_compile nba_features_indexadas.py nba_laboratorio_prospectivo.py
      - name: Publicar solo en rama experimental
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- nba_features_indexadas.py nba_laboratorio_prospectivo.py
          if ! git diff --cached --quiet; then
            git commit -m 'NBA: indexar caracteristicas historicas con equivalencia validada'
            git push origin HEAD:pruebas-integracion-nba-4-motores
          fi
