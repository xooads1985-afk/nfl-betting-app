name: NFL laboratorio integral experimental
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nfl-laboratorio-historial
  cancel-in-progress: false
jobs:
  prospectivo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Código experimental aislado
        uses: actions/checkout@v4
        with:
          ref: laboratorio-nfl-validacion
          persist-credentials: false
          path: laboratorio
      - name: Comprobar rama de historial antes de iniciar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git ls-remote --exit-code --heads \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            refs/heads/historial-nfl-lab >/dev/null; then
            echo 'ERROR: Falta la rama historial-nfl-lab. No se modifica main.' >&2
            exit 1
          fi
      - name: Historial persistente independiente
        uses: actions/checkout@v4
        with:
          ref: historial-nfl-lab
          path: historial
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias
        run: python -m pip install pandas numpy scikit-learn nflreadpy pyarrow
      - name: Comprobar archivos experimentales
        working-directory: laboratorio
        run: |
          python -m compileall -q descargar_original.py orquestar_experimental.py publicar_historial.py evaluar_precision_nfl.py
          python -m unittest discover -p 'test_*.py' -v
      - name: Descargar calendario original
        working-directory: laboratorio
        run: python descargar_original.py --seasons 2022 2023 2024 2025 2026 --output calendario_original.csv
      - name: Auditar y proyectar
        working-directory: laboratorio
        run: python orquestar_experimental.py --origen calendario_original.csv --destino resultados_nfl
      - name: Fusionar historial validado
        working-directory: laboratorio
        run: python publicar_historial.py --prospectivas resultados_nfl/prospectivas.csv --historial ../historial/historial_prospectivo.csv --omitir-existentes
      - name: Evaluar precisión prospectiva
        working-directory: laboratorio
        run: |
          python evaluar_precision_nfl.py \
            --historial ../historial/historial_prospectivo.csv \
            --calendario calendario_original.csv \
            --destino resultados_nfl
      - name: Publicar sin forzar ni sobrescribir predicciones
        working-directory: historial
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add historial_prospectivo.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Registrar predicciones prospectivas NFL'
            git push origin HEAD:historial-nfl-lab
          fi
      - name: Conservar auditoría y predicciones
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-lab-auditoria
          path: laboratorio/resultados_nfl/
          if-no-files-found: warn
          retention-days: 14
