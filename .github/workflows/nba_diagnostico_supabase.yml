name: NBA - Diagnostico Supabase solo lectura
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pruebas-integracion-nba-4-motores
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Crear consulta segura
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          Path("nba_consulta_consolidada.py").write_bytes(base64.b64decode(""))
          PY
      - name: Integrar diagnostico en tarjeta
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("nba_tarjeta_auto.py")
          s = p.read_text(encoding="utf-8")
          marca = "NBA_DIAGNOSTICO_SUPABASE_SOLO_GET_V1"
          if marca in s:
              print("Diagnóstico ya instalado.")
              raise SystemExit(0)
          ancla = '        st.caption("No escribe ni modifica registros en Supabase.")'
          if s.count(ancla) != 1:
              raise RuntimeError("No se encontró el ancla de auditoría. No se modificó nada.")
          bloque = """
                  # NBA_DIAGNOSTICO_SUPABASE_SOLO_GET_V1
                  with st.expander("🔍 Supabase · diagnóstico de solo lectura"):
                      from nba_consulta_consolidada import comprobar_registro
                      clave_registro = "nba-consolidado-v1:" + str(compartido["partido_id"])
                      url_sb = str(st.secrets.get("SUPABASE_URL", ""))
                      clave_sb = str(st.secrets.get("SUPABASE_SECRET_KEY", ""))
                      if not url_sb or not clave_sb:
                          st.warning("Falta la conexión existente de Supabase.")
                      else:
                          resultado_sb = comprobar_registro(
                              clave_registro, url=url_sb, clave=clave_sb
                          )
                          st.write("Estado de consulta:", resultado_sb["estado"])
                          if resultado_sb["estado"] == "registro_existente":
                              st.caption("Clave: " + str(resultado_sb.get("clave_unica", "")))
                              st.caption("SHA-256: " + str(resultado_sb.get("huella_sha256", "")))
                          elif resultado_sb["estado"] == "tabla_no_disponible":
                              st.info("La tabla consolidada aún no está disponible.")
                          elif resultado_sb["estado"] == "sin_registro":
                              st.info("La tabla responde, pero este partido aún no tiene registro.")
                          else:
                              st.caption("No se han modificado datos.")
                      st.caption("Consulta GET exclusivamente; no guarda ni actualiza.")
          """
          s=s.replace(ancla,ancla+"\n"+bloque.rstrip(),1)
          compile(s,str(p),"exec")
          p.write_text(s,encoding="utf-8")
          print("Diagnóstico conectado sin escrituras.")
          PY
      - name: Comprobar sintaxis
        run: python -m py_compile nba_tarjeta_auto.py nba_consulta_consolidada.py
      - name: Guardar solo en rama experimental
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- nba_tarjeta_auto.py nba_consulta_consolidada.py
          if ! git diff --cached --quiet; then
            git commit -m "NBA: diagnostico Supabase sin escritura"
            git push origin HEAD:pruebas-integracion-nba-4-motores
          fi
