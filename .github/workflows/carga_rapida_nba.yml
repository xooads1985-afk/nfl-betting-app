name: Tarjeta NBA carga rápida sin ESPN histórico
on:
  push:
    branches: [pruebas-integracion-nba-4-motores]
    paths:
      - carga_rapida_nba.py
      - .github/workflows/carga_rapida_nba.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aplicar:
    if: github.ref_name == 'pruebas-integracion-nba-4-motores'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pruebas-integracion-nba-4-motores
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar y verificar sintaxis
        run: |
          python carga_rapida_nba.py
          python -m py_compile resumen_inteligente_nba.py nba_tarjeta_puente.py
      - name: Guardar cambios en rama de pruebas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resumen_inteligente_nba.py nba_tarjeta_puente.py
          if ! git diff --cached --quiet; then
            git commit -m 'Evitar consultas ESPN historicas durante tarjeta NBA'
            git push origin HEAD:pruebas-integracion-nba-4-motores
          fi
