name: NBA - Restaurar historial funcional
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restaurar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pruebas-integracion-nba-4-motores
      - name: Restaurar cargador mensual verificado
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("nba_tarjeta_auto.py")
          s=p.read_text(encoding="utf-8")
          actual='''            # NBA_HISTORIAL_PERSISTENTE_RAPIDO_V1
            from nba_historial_persistente_rapido import cargar_historial_rapido
            def _historial_mensual(desde, hasta):
                return cargar_historial_rapido(cargador_historial, desde, hasta)
            dependencias = adaptadores_reales(
                cargador_historial=_historial_mensual
            )'''
          anterior='''            # NBA_HISTORIAL_MENSUAL_CACHE_V1
            from nba_historial_bloques import cargar_por_bloques
            def _historial_mensual(desde, hasta):
                return cargar_por_bloques(cargador_historial, desde, hasta)
            dependencias = adaptadores_reales(
                cargador_historial=_historial_mensual
            )'''
          if actual not in s:
              raise SystemExit("El bloque esperado no coincide: no se modificó ningún archivo")
          s=s.replace(actual,anterior,1)
          compile(s,str(p),"exec")
          p.write_text(s,encoding="utf-8")
          print("Restaurado el cargador mensual con caché")
          PY
      - name: Verificar sintaxis
        run: python -m py_compile nba_tarjeta_auto.py
      - name: Publicar restauración experimental
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba_tarjeta_auto.py
          if ! git diff --cached --quiet; then
            git commit -m "NBA: restaurar historial mensual funcional"
            git push origin HEAD:pruebas-integracion-nba-4-motores
          fi
