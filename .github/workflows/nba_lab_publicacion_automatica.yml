name: NBA Laboratorio - Publicacion automatica
on:
  workflow_dispatch:
  schedule:
    - cron: '27 */6 * * *'
permissions:
  contents: write
concurrency:
  group: nba-lab-publicacion
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Obtener rama experimental
        uses: actions/checkout@v4
        with:
          ref: nba-lab-pruebas
          fetch-depth: 0
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias del laboratorio
        run: pip install pandas numpy scipy scikit-learn requests
      - name: Pruebas de publicador y lector
        run: python -m unittest -v test_publicador test_fuente_remota test_lector_tarjetas test_adaptador_visual
      - name: Generar diez tarjetas reales
        run: python nba_lab_lotes.py --max-partidos 10
      - name: Validar y preparar publicación
        run: python nba_lab_publicador.py
      - name: Publicar solo datos experimentales
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- nba_lab_publicado/
          if git diff --cached --quiet; then
            echo 'Sin cambios en tarjetas'
            exit 0
          fi
          git commit -m 'NBA lab: actualizar tarjetas experimentales'
          git push origin HEAD:nba-lab-pruebas
      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-publicacion-diagnostico
          path: |
            nba_lab_resultados_futuro/lotes/indice_tarjetas.json
            nba_lab_publicado/indice_tarjetas.json
          if-no-files-found: ignore
          retention-days: 7
